apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: {app: todo-frontend}
  template:
    metadata:
      labels: {app: todo-frontend}
    spec:
      containers:
      - name: frontend
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/todo-frontend:latest
        ports: [{containerPort: 5173}]
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: todo
spec:
  selector: {app: todo-frontend}
  ports: [{port: 80, targetPort: 5173}]
  type: ClusterIP
