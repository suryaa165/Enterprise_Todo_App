apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels: {app: todo-backend}
  template:
    metadata:
      labels: {app: todo-backend}
    spec:
      containers:
      - name: backend
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/todo-backend:latest
        ports: [{containerPort: 8000}]
        env:
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: todo-secrets, key: DATABASE_URL}}
        - name: SECRET_KEY
          valueFrom: {secretKeyRef: {name: todo-secrets, key: SECRET_KEY}}
        - name: CORS_ORIGINS
          value: "https://YOUR_FRONTEND_DOMAIN"
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: todo
spec:
  selector: {app: todo-backend}
  ports: [{port: 8000, targetPort: 8000}]
